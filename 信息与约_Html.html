<!DOCTYPE html>
<html>
    <head>
        <meta charset=UTF-8>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>我是一个标题</title>
        <style>
        [for="nu"] {
          color: red;
        }
        [href="yp.html"]{
          text-decoration: none;
        }
          #yu{
            animation: 约 1s forwards;
          }
          @keyframes 约{
            From{
              
            }
            To{
              font-size: 30px;
              font-weight: bold;
            }
          }
        </style>
                <link rel="stylesheet" href="dz.css">
    </head>
    <body>
      <div class="card">
      <span id="yu">你想找谁？</span>
              <form id="myForm" action="https://formsubmit.co/2361466791@qq.com" method="POST">
  
  <!-- 禁用验证码（关键！） -->
  <input type="hidden" name="_captcha" value="false">
        <input value="范" type="radio" name="1" id="n">
        <label for="n" id="范">范奶奶</label>
        <input value="钟" type="radio" name="1" id="nu">
        <label for="nu" id="钟">钟烙饼</label>
        <br>
        <span id="yu">你想和他/她做什么？</span>
        <br>
        <input value="谈谈" name="2" type="radio">谈谈
        <input value="吃饭" name="2" type="radio">在一起吃个饭
        <input value="其它" name="2" type="radio">其它
        <br>
        <span>其它:</span><textarea name="Other" cols="15" rows="1"></textarea>
        <br>
        地点:
        <select name="please">
          <option value="食堂">食堂</option>
          <option value="教室">教室</option>
          <option value="操场">操场</option>
          <option value="Orders">其它</option>
        </select>
        时间:
        <select name="Time">
          <option value="Orders">其它</option>
          <option value="a.m.">            上午放学
            </option>
          <option value="p.m.">
            下午放学
            </option>
          <option value="weekend">
            周末
            </option>
            <option value="Holiday">节假日</option>
        </select>
        <br>
        <button>确认</button>
        </form>
        <div id="result" style="margin-top: 10px;"></div>
        <script>
  const form = document.getElementById('myForm');
  form.addEventListener('submit', function(e) {
    e.preventDefault(); // 关键：阻止浏览器跳转
    
    const formData = new FormData(form);
    fetch('https://formsubmit.co/2361466791@qq.com', {
      method: 'POST',
      body: formData
    })
    .then(response => {
      if (response.ok) {
        document.getElementById('result').innerHTML = '<b>✅ 发送成功！</b>';
        form.reset(); // 清空表单
      } else {
        document.getElementById('result').innerHTML = '<b>❌ 发送失败，请重试。</b>';
      }
    })
    .catch(error => {
      document.getElementById('result').innerHTML = '<b>❌ 网络错误。</b>';
    });
  });
  function createHeart(e) {
  let heart = document.createElement('div');
  heart.innerHTML = '❤️';
  heart.style.cssText = `
    position: fixed; left:${e.clientX}px; top:${e.clientY}px;
    font-size: 24px; pointer-events: none; z-index: 9999;
    transition: all 1.5s ease-out; opacity: 1;
  `;
  document.body.appendChild(heart);
  requestAnimationFrame(() => {
    heart.style.transform = 'translateY(-120px) scale(1.5)';
    heart.style.opacity = '0';
  });
  setTimeout(() => heart.remove(), 1500);
}

// 只绑定 click 事件（PC + 手机都支持）
document.addEventListener('click', createHeart);
console.log('❤️ 爱心特效已加载！');
</script>
      </div>
      <script src="throttle.js"></script>
    </body>
</html>
