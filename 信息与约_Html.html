<!DOCTYPE html>
<html>
    <head>
        <meta charset=UTF-8>
        <title>我是一个标题</title>
        <style>
        [for="nu"] {
          color: red;
        }
        [href="yp.html"]{
          text-decoration: none;
        }
          #yu{
            animation: 约 1s forwards;
          }
          @keyframes 约{
            From{
              
            }
            To{
              font-size: 30px;
              font-weight: bold;
            }
          }
        </style>
                <link rel="stylesheet" href="dz.css">
    </head>
    <body>
      <span id="yu">你想找谁？</span>
              <form id="myForm" action="https://formsubmit.co/com_1324@qq.com" method="POST">
  
  <!-- 禁用验证码（关键！） -->
  <input type="hidden" name="_captcha" value="false">
        <input type="radio" name="1" id="n">
        <label value="范" for="n" id="范">范奶奶</label>
        <input value="钟" type="radio" name="1" id="nu">
        <label for="nu" id="钟">钟烙饼</label><br>
        <span id="yu">你想和他/她做什么？</span>
        <br>
        <input value="谈谈" name="2" type="radio">谈谈
        <input value="吃饭" name="2" type="radio">在一起吃个饭
        <br>
        <span>其他:</span><textarea name="Other" cols="15" rows="1"></textarea>
        <br>
        地点:
        <select name="please">
          <option value="食堂">食堂</option>
          <option value="教室">教室</option>
          <option value="操场">操场</option>
          <option value="Orders">其它</option>
        </select>
        时间:
        <select name="Time">
          <option value="a.m.">            上午放学
            </option>
          <option value="p.m.">
            下午放学
            </option>
          <option value="weekend">
            周末
            </option>
            <option value="Holiday">节假日</option>
        </select>
        <br>
        <button>确认</button>
        </form>
        <div id="result" style="margin-top: 10px;"></div>
        <script>
  const form = document.getElementById('myForm');
  form.addEventListener('submit', function(e) {
    e.preventDefault(); // 关键：阻止浏览器跳转
    
    const formData = new FormData(form);
    fetch('https://formsubmit.co/com_1324@qq.com', {
      method: 'POST',
      body: formData
    })
    .then(response => {
      if (response.ok) {
        document.getElementById('result').innerHTML = '<b>✅ 发送成功！</b>';
        form.reset(); // 清空表单
      } else {
        document.getElementById('result').innerHTML = '<b>❌ 发送失败，请重试。</b>';
      }
    })
    .catch(error => {
      document.getElementById('result').innerHTML = '<b>❌ 网络错误。</b>';
    });
  });
</script>
    </body>
</html>
