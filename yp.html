<!DOCTYPE html>
<html class="f">
    <head>
        <meta charset=UTF-8>
        <title>标题</title>
        <link rel="stylesheet" href="dz.css">
        <style>
          h1{
            font-size: 50px;
          }
          h2{
            font-size: 1px;
            animation:p 1.2s ease forwards;
          }
          @keyframes p{
            1%{
              font-size: 2px;
            }
            100%{
              font-size: 30px;
              color:#4c4c4cbd;
            }
          }
        </style>
    </head>
    <body>
      <h1 class="dz">你在想屁吃?</h1>
      <h2>没想到你是这种龌龊的人</h2>
    </body>
</html>
