        <script>
          function createHeart(e) {
  let heart = document.createElement('div');
  heart.innerHTML = '❤️';
  heart.style.cssText = `
    position: fixed; left:${e.clientX}px; top:${e.clientY}px;
    font-size: 24px; pointer-events: none; z-index: 9999;
    transition: all 1.5s ease-out; opacity: 1;
  `;
  document.body.appendChild(heart);
  requestAnimationFrame(() => {
    heart.style.transform = 'translateY(-120px) scale(1.5)';
    heart.style.opacity = '0';
  });
  setTimeout(() => heart.remove(), 1500);
}

// 只绑定 click 事件（PC + 手机都支持）
document.addEventListener('click', createHeart);
console.log('❤️ 爱心特效已加载！');
        </script>
